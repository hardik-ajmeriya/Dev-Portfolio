<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#14110f" />

<title>Hardik — Coming soon</title>
<meta name="description" content="Something new is being built here. Coming soon." />

<!-- Keep the placeholder out of search results, so Google's first indexed
     version of this domain is the real site rather than "Coming soon".
     Remove this line (and robots.txt) at launch. -->
<meta name="robots" content="noindex, nofollow" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Hardik — Coming soon" />
<meta property="og:description" content="Something new is being built here. Coming soon." />
<meta property="og:url" content="https://hardikajmeriya.com" />
<meta name="twitter:card" content="summary" />

<link rel="canonical" href="https://hardikajmeriya.com" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="rig" aria-hidden="true">
  <div class="cob l"><span class="head"></span><span class="cone"></span></div>
  <div class="cob r"><span class="head"></span><span class="cone"></span></div>
</div>

<div class="stage">
  <div class="mount" aria-hidden="true"><span class="screw"></span></div>

  <div class="swing" id="swing">
    <div class="ropes" aria-hidden="true">
      <span class="rope l"></span>
      <span class="rope r"></span>
      <span class="knot"></span>
    </div>

    <div class="board">
      <div class="inner">
        <div class="kicker">Hardik Ajmeriya</div>
        <h1 class="sign">Coming Soon</h1>
        <div class="rule"></div>
        <p class="tag">Something new is being built here.</p>
      </div>
    </div>
  </div>

  <div class="shadow" aria-hidden="true"></div>

  <!--
    Countdown. Deliberately outside .swing: the sign moves, and digits that
    move with it are unpleasant to read. A still counter under a swinging
    board also reads better than two things moving at once.

    Progressive enhancement — the launch date is in the HTML, so this is
    readable with JavaScript off or blocked. countdown.js reveals the digits
    and rewrites the date line into the visitor's own timezone.
  -->
  <section class="cd" id="cd">
    <p class="cd-lead" id="cdLead">Launching</p>

    <!--
      aria-hidden on the digits, on purpose. A screen reader announcing a
      changing number once a second is unusable. The date line below is the
      accessible version and says the same thing, once.
    -->
    <ol class="cd-grid" id="cdGrid" aria-hidden="true" hidden>
      <li><span class="cd-num" id="cdD">--</span><span class="cd-lab">Days</span></li>
      <li><span class="cd-num" id="cdH">--</span><span class="cd-lab">Hours</span></li>
      <li><span class="cd-num" id="cdM">--</span><span class="cd-lab">Minutes</span></li>
      <li><span class="cd-num" id="cdS">--</span><span class="cd-lab">Seconds</span></li>
    </ol>

    <p class="cd-when" id="cdWhen">Tuesday, 15 September 2026 &middot; 14:00 IST</p>
  </section>

  <div class="spacer"></div>

  <footer>
    <a href="mailto:hardik.ajmeriya89@gmail.com">hardik.ajmeriya89@gmail.com</a>
    <a href="https://github.com/hardik-ajmeriya" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
</div>

<div class="vig" aria-hidden="true"></div>

<script src="sign.js" defer></script>
<script src="countdown.js" defer></script>
</body>
</html>
