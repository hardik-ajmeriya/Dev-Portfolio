<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#14110f" />

<title>Hardik — Coming soon</title>
<meta name="description" content="Something new is being built here. Coming soon." />

<meta property="og:type" content="website" />
<meta property="og:title" content="Hardik — Coming soon" />
<meta property="og:description" content="Something new is being built here. Coming soon." />
<meta property="og:url" content="https://hardikajmeriya.com" />
<meta name="twitter:card" content="summary" />

<link rel="canonical" href="https://hardikajmeriya.com" />
<link rel="icon" type="image/png" href="/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Karla:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --night:#14110f;
    --night-2:#1d1916;
    --cream:#f2e7d5;
    --brass:#c9a227;
    --wood-1:#7a4f2a;
    --wood-2:#5e3a1e;
    --wood-3:#452a15;
    --rope:#b9a184;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Karla',system-ui,sans-serif;
    background:var(--night);
    color:var(--cream);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* warm lamp glow from above */
  .glow{
    position:fixed;left:50%;top:-18vh;transform:translateX(-50%);
    width:min(120vw,1100px);height:80vh;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 0%,
      rgba(255,196,110,.20) 0%,
      rgba(255,170,80,.09) 32%,
      rgba(0,0,0,0) 68%);
  }
  /* vignette */
  .vig{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%);
  }
  ::selection{background:var(--brass);color:var(--night)}

  .stage{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;align-items:center;
  }

  /* ---------- ceiling beam ---------- */
  .beam{
    width:min(92vw,620px);height:16px;margin-top:0;
    border-radius:0 0 5px 5px;
    background:linear-gradient(180deg,#2b2420 0%,#221c18 55%,#171310 100%);
    box-shadow:0 6px 18px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.05);
    position:relative;flex:none;
  }
  .beam::before,.beam::after{
    content:'';position:absolute;bottom:-5px;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e8d9a8, var(--brass) 60%, #7d6415);
    box-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .beam::before{left:22%}
  .beam::after{right:22%}

  /* ---------- the swinging assembly ---------- */
  .swing{
    transform-origin:50% 0;
    animation:swing 4.6s cubic-bezier(.45,0,.55,1) infinite;
    display:flex;flex-direction:column;align-items:center;
    will-change:transform;
  }
  @keyframes swing{
    0%,100%{ transform:rotate(-7.5deg) }
    50%    { transform:rotate(7.5deg) }
  }
  .swing.nudge{ animation:swingBig 4.6s cubic-bezier(.45,0,.55,1) 2 }
  @keyframes swingBig{
    0%,100%{ transform:rotate(-13deg) }
    50%    { transform:rotate(13deg) }
  }

  .ropes{
    position:relative;width:min(80vw,420px);height:clamp(52px,9vh,104px);flex:none;
  }
  .rope{
    position:absolute;top:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--rope),#8d7a63);
    box-shadow:0 0 4px rgba(0,0,0,.5);
    border-radius:2px;
  }
  .rope.l{left:14%;transform:rotate(3.2deg);transform-origin:top center}
  .rope.r{right:14%;transform:rotate(-3.2deg);transform-origin:top center}

  /* ---------- the board ---------- */
  .board{
    position:relative;
    width:min(86vw,500px);
    padding:clamp(30px,5.2vh,52px) clamp(20px,5vw,48px);
    text-align:center;
    border-radius:12px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.16)),
      repeating-linear-gradient(92deg,
        var(--wood-1) 0px, var(--wood-2) 3px, var(--wood-1) 7px, var(--wood-3) 11px, var(--wood-1) 15px);
    border:1px solid rgba(0,0,0,.5);
    box-shadow:
      inset 0 2px 0 rgba(255,225,180,.16),
      inset 0 -3px 8px rgba(0,0,0,.5),
      0 22px 44px rgba(0,0,0,.6);
    animation:sway 4.6s cubic-bezier(.45,0,.55,1) infinite;
    animation-delay:-.28s; /* trails the ropes slightly — reads as weight */
    will-change:transform;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(1.5deg) }
    50%    { transform:rotate(-1.5deg) }
  }
  /* screw heads */
  .board::before,.board::after{
    content:'';position:absolute;top:11px;width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f0e2b4, var(--brass) 55%, #6d5712);
    box-shadow:0 1px 2px rgba(0,0,0,.7);
  }
  .board::before{left:14px}
  .board::after{right:14px}

  .inner{
    border:1px solid rgba(242,231,213,.22);
    border-radius:6px;
    padding:clamp(18px,3.4vh,30px) clamp(10px,3vw,22px);
  }

  .kicker{
    font-size:clamp(9px,1.6vw,11px);
    letter-spacing:.34em;text-transform:uppercase;
    color:rgba(242,231,213,.62);
    margin-bottom:clamp(10px,1.8vh,16px);
  }
  .sign{
    font-family:'DM Serif Display',Georgia,serif;
    font-size:clamp(2rem,7.4vw,3.7rem);
    line-height:1.02;
    color:var(--cream);
    text-shadow:0 2px 0 rgba(0,0,0,.45), 0 0 22px rgba(255,200,120,.22);
  }
  .rule{
    width:44px;height:1px;margin:clamp(14px,2.2vh,20px) auto 0;
    background:linear-gradient(90deg,transparent,var(--brass),transparent);
  }
  .tag{
    margin-top:clamp(12px,2vh,18px);
    font-size:clamp(11px,2vw,13px);
    letter-spacing:.05em;
    color:rgba(242,231,213,.68);
  }

  /* ---------- ground shadow ---------- */
  .shadow{
    margin-top:clamp(26px,5vh,58px);
    width:min(64vw,330px);height:16px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.55),rgba(0,0,0,0) 72%);
    animation:shadowShift 4.6s cubic-bezier(.45,0,.55,1) infinite;
    flex:none;
  }
  @keyframes shadowShift{
    0%,100%{ transform:translateX(-28px) scaleX(.9); opacity:.5 }
    50%    { transform:translateX(28px)  scaleX(.9); opacity:.5 }
    25%,75%{ transform:translateX(0)     scaleX(1.06); opacity:.68 }
  }

  /* ---------- layout ---------- */
  .top-pad{flex:0 0 auto}
  .spacer{flex:1 1 auto;min-height:8px}

  footer{
    position:relative;z-index:3;
    width:100%;padding:0 24px clamp(20px,4vh,34px);
    display:flex;justify-content:center;gap:28px;flex-wrap:wrap;
    font-size:12.5px;
  }
  footer a{
    color:rgba(242,231,213,.55);text-decoration:none;
    border-bottom:1px solid rgba(242,231,213,.16);padding-bottom:2px;
    transition:color .3s,border-color .3s;
  }
  footer a:hover{color:var(--brass);border-color:var(--brass)}

  @media (prefers-reduced-motion: reduce){
    .swing,.board,.shadow{animation:none}
    .swing{transform:rotate(0)}
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="stage">
  <div class="beam" aria-hidden="true"></div>

  <div class="swing" id="swing">
    <div class="ropes" aria-hidden="true">
      <span class="rope l"></span>
      <span class="rope r"></span>
    </div>

    <div class="board">
      <div class="inner">
        <div class="kicker">Hardik Ajmeriya</div>
        <h1 class="sign">Coming&nbsp;Soon</h1>
        <div class="rule"></div>
        <p class="tag">Something new is being built here.</p>
      </div>
    </div>
  </div>

  <div class="shadow" aria-hidden="true"></div>

  <div class="spacer"></div>

  <footer>
    <a href="mailto:hardik.ajmeriya89@gmail.com">hardik.ajmeriya89@gmail.com</a>
    <a href="https://github.com/hardik-ajmeriya" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>
</div>

<div class="vig" aria-hidden="true"></div>

<script>
  // Give the sign a push when you click it.
  (function () {
    var swing = document.getElementById('swing');
    if (!swing) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    swing.addEventListener('click', function () {
      if (swing.classList.contains('nudge')) return;
      swing.classList.add('nudge');
      setTimeout(function () { swing.classList.remove('nudge'); }, 9200);
    });
  })();
</script>
</body>
</html>
