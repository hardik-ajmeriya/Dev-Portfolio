<html lang="en">

    <!-- Title leads with the name, because ranking for "Hardik Ajmeriya" is
         the primary goal. Role follows for relevance on skill searches. -->
    <title>Hardik Ajmeriya — Full-Stack Developer &amp; Cloud Engineer</title>
    <meta

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Hardik Ajmeriya" />
    <meta property="og:url" content="https://hardikajmeriya.com/" />
    <meta property="og:title" content="Hardik Ajmeriya — Full-Stack Developer &amp; Cloud Engineer" />
    <meta
      property="og:description"
      content="MERN applications built end-to-end and deployed to production on AWS. Available for freelance projects."
    />
    <meta property="og:locale" content="en_IN" />
    <!--
      A purpose-built 1200x630 card, not the hero portrait.

      Two reasons the old value was a problem. It pointed at a WebP, and
      several link scrapers (notably some versions of the LinkedIn and
      WhatsApp fetchers) will not render WebP and simply show no image. And
      it was a 900x1213 portrait, so anything that did render it letterboxed
      a tall photo into a wide slot. Declaring width/height also stops the
      preview box reflowing while the image loads.
    -->
    <meta property="og:image" content="https://hardikajmeriya.com/images/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Hardik Ajmeriya — I build web apps and put them into production. MERN, AWS, Docker, Kubernetes, CI/CD."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hardik Ajmeriya — Full-Stack Developer &amp; Cloud Engineer" />
    <meta
      name="twitter:description"
      content="MERN applications built end-to-end and deployed to production on AWS."
    />
    <meta name="twitter:image" content="https://hardikajmeriya.com/images/og-card.png" />
    <meta
      name="twitter:image:alt"
      content="Hardik Ajmeriya — I build web apps and put them into production."
    />

    <!--
      Structured data. This is the highest-value thing on the page for AI
      search: it states plainly who you are, what you do and what you offer,
      in a format models and search engines parse directly rather than infer.

      `sameAs` is what ties this domain to your other profiles and is the main
      signal for ranking your own name. Every URL here must resolve — a 404 in
      sameAs weakens the entity rather than strengthening it, which is why the
      x.com placeholder was removed instead of left in. Add X/Instagram back
      only once the real handles exist.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "url": "https://hardikajmeriya.com/",
        "mainEntity": {
          "@type": "Person",
          "@id": "https://hardikajmeriya.com/#hardik",
          "name": "Hardik Ajmeriya",
          "givenName": "Hardik",
          "familyName": "Ajmeriya",
          "url": "https://hardikajmeriya.com/",
          "email": "mailto:hardik.ajmeriya89@gmail.com",
          "jobTitle": "Full-Stack Developer & Cloud Engineer",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Rajkot",
            "addressRegion": "Gujarat",
            "addressCountry": "IN"
          },
          "description": "Full-stack developer who builds MERN applications and deploys them to production on AWS with Docker, Kubernetes, Terraform and CI/CD pipelines.",
          "knowsAbout": [
            "MERN stack development",
            "React",
            "Node.js",
            "Express.js",
            "MongoDB",
            "Next.js",
            "JavaScript",
            "TypeScript",
            "REST API development",
            "AWS",
            "Amazon EKS",
            "Docker",
            "Kubernetes",
            "Terraform",
            "CI/CD pipelines",
            "GitHub Actions",
            "Jenkins",
            "Argo CD",
            "GitOps",
            "Prometheus",
            "Grafana",
            "DevOps",
            "Cloud infrastructure",
            "Web application deployment",
            "SaaS development",
            "Multi-tenant architecture",
            "Subscription billing",
            "Stripe integration"
          ],
          "sameAs": [
            "https://github.com/hardik-ajmeriya",
            "https://www.linkedin.com/in/hardik-ajmeriya"
          ],
          "makesOffer": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Full-Stack Web Application Development",
                "description": "Custom web applications built on MongoDB, Express, React and Node — client portals, dashboards, storefronts and internal tools."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "SaaS Product Development",
                "description": "Subscription products built end to end — multi-tenant architecture, authentication and roles, billing, an admin dashboard, and the infrastructure to run it."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "API Development & Integration",
                "description": "REST APIs designed, documented and secured, plus integration of payments, authentication and third-party services."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Cloud Deployment & Infrastructure",
                "description": "Applications provisioned and deployed on AWS with SSL, domains and environment separation handled."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "CI/CD Pipeline Automation",
                "description": "Automated build, test and deploy pipelines with rollback paths, using GitHub Actions, Jenkins and Argo CD."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Containerisation & Kubernetes",
                "description": "Services packaged into Docker images and orchestrated on Kubernetes so applications scale under load."
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Monitoring, Maintenance & Support",
                "description": "Dashboards and alerting with Prometheus and Grafana, plus ongoing fixes and infrastructure care after handover."
              }
            }
          ]
        }
      }
    </script>

    <!--
      Fonts are self-hosted (see src/index.css). They used to be loaded from
      fonts.googleapis.com, which put a third-party stylesheet on the critical
      path in front of the largest text on the page, and required two
      sequential round trips before a single glyph could be fetched: the CSS
      from googleapis, then the files from gstatic. Serving them from this
      origin reuses the connection that already delivered the HTML.

      prerender.js injects <link rel="preload"> tags for the two fonts the
      first screen actually needs, using the hashed filenames from the build.
    -->

    <!--
      WebSite entity. `alternateName` helps search engines connect variations
      of the name to this site.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://hardikajmeriya.com/",
        "name": "Hardik Ajmeriya",
        "alternateName": [
          "Hardik Ajmeriya Portfolio",
          "Hardik Ajmeriya — Full-Stack Developer"
        ],
        "inLanguage": "en",
        "publisher": {
          "@id": "https://hardikajmeriya.com/#hardik"
        }
      }
    </script>

    <!--
      FAQPage. Generated from src/data/faq.js — if you edit the questions
      there, regenerate this block. Google requires structured data to match
      the visible page text, and mismatches can cost you the rich result.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What kind of projects do you take on?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Web applications built on the MERN stack — React, Node.js, Express and MongoDB. Typically client portals, admin dashboards, storefronts, booking systems and internal business tools. I also take on the cloud side: deploying to AWS, setting up CI/CD pipelines, containerising with Docker and Kubernetes, and putting monitoring in place."
            }
          },
          {
            "@type": "Question",
            "name": "What makes you different from other freelance developers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most freelance developers hand over a repository and stop there, which leaves you to work out hosting, deployment and monitoring on your own. I do both halves — the application and the infrastructure it runs on. You get a deployed, monitored, running system rather than code you still need someone else to launch."
            }
          },
          {
            "@type": "Question",
            "name": "How do you price a project?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Fixed price, agreed before any work starts. After a free twenty-minute discovery call I send a written breakdown of scope, timeline and cost. If the scope changes later we agree the change first, so there are no surprise invoices. I do not bill hourly for defined projects."
            }
          },
          {
            "@type": "Question",
            "name": "How long does a project usually take?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It depends entirely on scope, so I give a specific timeline in the written quote rather than a generic estimate. A focused MVP is usually a few weeks; a larger application with integrations and custom infrastructure takes longer. You will have a staging URL to click through throughout, so progress is visible rather than something you take on trust."
            }
          },
          {
            "@type": "Question",
            "name": "Can you take over a project someone else started?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Inheriting an existing codebase is common, whether the previous developer left, the project stalled, or it works locally but was never deployed. I will review what exists and tell you honestly whether it is better to continue with it or rebuild — including when continuing is the cheaper answer."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after the project launches?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The application goes live on production infrastructure with monitoring and alerting configured, so problems surface before your customers report them. I stay available afterwards for bug fixes, new features and infrastructure maintenance. You are not handed a system and left alone with it."
            }
          },
          {
            "@type": "Question",
            "name": "Do you work with clients remotely?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, entirely remotely, and with clients in any timezone. Communication is over email and scheduled calls, with regular written updates. I reply to enquiries within 24 hours, Monday to Saturday."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
